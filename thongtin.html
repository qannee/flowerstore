<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin tài khoản</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .card { border-radius: 12px; margin-top: 60px; }
    .btn-primary { border-radius: 20px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="dadangnhap.html">Shop</a>
    <button class="navbar-toggler" data-toggle="collapse" data-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ml-auto" id="main-navbar">
        <li class="nav-item"><a class="nav-link" href="dadangnhap.html">Mua sắm</a></li>
      </ul>
    </div>
  </nav>

  <!-- Nội dung -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <h4 class="text-center mb-4">Thông tin tài khoản</h4>

          <form id="profileForm">
            <div class="form-group">
              <label>Họ và tên</label>
              <input type="text" class="form-control" id="fullname" required>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" id="email" readonly>
            </div>
            <div class="form-group">
              <label>Số điện thoại</label>
              <input type="text" class="form-control" id="phone">
            </div>
            <button class="btn btn-primary btn-block" type="submit">Cập nhật thông tin</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const user = app.getCurrentUser();
      if (!user) {
        alert('Bạn cần đăng nhập để xem thông tin tài khoản.');
        window.location.href = 'dangnhap.html';
        return;
      }

      // Hiển thị thông tin user
      document.getElementById('fullname').value = user.fullname;
      document.getElementById('email').value = user.email;
      document.getElementById('phone').value = user.phone || '';

      // Cập nhật thông tin
      document.getElementById('profileForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const fullname = document.getElementById('fullname').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const result = app.updateProfile({ fullname, phone });

        if (result.ok) {
          alert('Cập nhật thông tin thành công!');
          location.reload();
        } else {
          alert('Lỗi khi cập nhật thông tin!');
        }
      });
    });
  </script>

</body>
</html>
