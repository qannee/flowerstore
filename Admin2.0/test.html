<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý nhập hàng</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f6f6f6;
        padding: 20px;
    }
    .container {
        width: 95%;
        margin: auto;
    }
    .title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    /* Form nhập kho */
    .import-box {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 5px rgba(0,0,0,0.1);
        margin-bottom: 25px;
    }

    .product-select {
        border: 1px solid #888;
        padding: 8px;
        border-radius: 5px;
        width: 100%;
    }

    .grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 50px;
        gap: 10px;
        margin-top: 10px;
        align-items: center;
    }

    .grid input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .add-btn {
        margin-top: 10px;
        padding: 8px 12px;
        background: #28a745;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    /* Bảng đơn nhập hàng */
    table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    th, td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
    }

    th {
        background: #f2f2f2;
    }
</style>
</head>
<body>

<div class="container">
    <div class="title">📦 Nhập Hàng (Nhập Kho)</div>

    <!-- FORM NHẬP NHIỀU SP -->
    <div class="import-box">
        <h3>Thêm đơn nhập hàng</h3>

        <div class="grid">
            <div>
                <select class="product-select">
                    <option>-- Chọn sản phẩm --</option>
                    <option>Hoa hồng đỏ</option>
                    <option>Hoa tulip vàng</option>
                    <option>Hoa lan trắng</option>
                </select>
            </div>
            <input type="number" placeholder="Số lượng">
            <input type="number" placeholder="Giá nhập (VND)">
            <input type="text" placeholder="Nhà cung cấp">
            <button>❌</button>
        </div>

        <div class="grid">
            <div>
                <select class="product-select">
                    <option>-- Chọn sản phẩm --</option>
                    <option>Hoa hồng đỏ</option>
                    <option>Hoa tulip vàng</option>
                    <option>Hoa lan trắng</option>
                </select>
            </div>
            <input type="number" placeholder="Số lượng">
            <input type="number" placeholder="Giá nhập (VND)">
            <input type="text" placeholder="Nhà cung cấp">
            <button>❌</button>
        </div>

        <button class="add-btn">+ Thêm sản phẩm</button>
    </div>

    <!-- DANH SÁCH ĐƠN NHẬP CÓ SẴN -->
    <h3>Danh sách đơn nhập</h3>
    <table>
        <tr>
            <th>Mã đơn</th>
            <th>Sản phẩm</th>
            <th>Số lượng</th>
            <th>Giá nhập</th>
            <th>Nhà cung cấp</th>
            <th>Ngày nhập</th>
        </tr>
        <tr>
            <td>NH001</td>
            <td>Hoa hồng đỏ</td>
            <td>50</td>
            <td>10,000 VND</td>
            <td>FlowerShop A</td>
            <td>10/11/2025</td>
        </tr>
        <tr>
            <td>NH002</td>
            <td>Hoa lan trắng</td>
            <td>30</td>
            <td>15,000 VND</td>
            <td>Green Garden</td>
            <td>08/11/2025</td>
        </tr>
        <tr>
            <td>NH003</td>
            <td>Hoa tulip vàng</td>
            <td>40</td>
            <td>12,000 VND</td>
            <td>Fresh Flower Co.</td>
            <td>05/11/2025</td>
        </tr>
    </table>
</div>

</body>
</html>
