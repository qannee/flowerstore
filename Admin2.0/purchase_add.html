<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tạo phiếu nhập hàng</title>
<style>
    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f5f6fa;
        padding: 30px;
        color: #333;
    }
    .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 30px 40px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 26px;
        color: #222;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px 25px;
        margin-bottom: 25px;
    }
    .form-group {
        display: flex;
        flex-direction: column;
    }
    label {
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 15px;
        color: #333;
    }
    input, select {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        transition: 0.2s ease;
        box-sizing: border-box;
    }
    input:focus, select:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 3px rgba(0,123,255,0.3);
    }

    /* Bảng sản phẩm */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 15px;
        table-layout: fixed;
    }
    th, td {
        border: 1px solid #ddd;
        text-align: center;
        padding: 8px;
        vertical-align: middle;
    }
    th {
        background: #f0f0f0;
        font-weight: 600;
        color: #333;
    }
    td select, td input {
        width: 95%;
        height: 38px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 5px;
        box-sizing: border-box;
    }
    td select:focus, td input:focus {
        border-color: #007bff;
        outline: none;
    }

    .add-row-btn {
        background: #17a2b8;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 12px;
        font-size: 15px;
        font-weight: 500;
    }
    .add-row-btn:hover {
        opacity: 0.9;
    }

    .btn-group {
        text-align: center;
        margin-top: 35px;
    }
    .save-btn, .back-btn {
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        padding: 12px 30px;
        font-weight: 600;
        color: white;
        margin: 0 8px;
        transition: 0.2s ease;
    }
    .save-btn { background: #28a745; }
    .save-btn:hover { opacity: 0.9; }

    .back-btn { background: #6c757d; }
    .back-btn:hover { opacity: 0.9; }

    button.delete-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 18px;
        color: #c00;
    }
    button.delete-btn:hover {
        color: #ff0000;
    }
</style>
</head>
<body>

<div class="container">
    <h2>🧾 Tạo phiếu nhập hàng mới</h2>

    <div class="form-grid">
        <div class="form-group">
            <label>Mã phiếu nhập</label>
            <input type="text" value="PN0006" readonly>
        </div>
        <div class="form-group">
            <label>Ngày nhập</label>
            <input type="date">
        </div>
        <div class="form-group">
            <label>Nhà cung cấp</label>
            <select>
                <option>-- Chọn nhà cung cấp --</option>
                <option>Công ty ABC</option>
                <option>Công ty XYZ</option>
                <option>Nhà cung cấp 123</option>
            </select>
        </div>
        <div class="form-group">
            <label>Người tạo phiếu</label>
            <input type="text" placeholder="Nhập tên nhân viên">
        </div>
    </div>

    <h3>📦 Danh sách sản phẩm</h3>
    <table id="productTable">
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Số lượng</th>
                <th>Đơn giá</th>
                <th>Xóa</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <select>
                        <option>-- Chọn sản phẩm --</option>
                        <option>Hoa Hồng</option>
                        <option>Hoa Ly</option>
                        <option>Hoa Mai</option>
                        <option>Hoa Huệ</option>
                    </select>
                </td>
                <td><input type="number" min="1" value="1"></td>
                <td><input type="number" min="0" value="0"></td>
                <td><button class="delete-btn" onclick="deleteRow(this)">✖</button></td>
            </tr>
        </tbody>
    </table>

    <button class="add-row-btn" onclick="addRow()">+ Thêm sản phẩm</button>

    <div class="btn-group">
        <button class="back-btn" onclick="window.location.href='purchase.html'">Quay lại</button>
        <button class="save-btn" onclick="window.location.href='purchase_check.html'">Lưu phiếu nhập</button>
    </div>
</div>

<script>
    function addRow() {
        const table = document.getElementById('productTable').querySelector('tbody');
        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td>
                <select>
                    <option>-- Chọn sản phẩm --</option>
                    <option>Hoa Hồng</option>
                    <option>Hoa Ly</option>
                    <option>Hoa Mai</option>
                    <option>Hoa Huệ</option>
                </select>
            </td>
            <td><input type="number" min="1" value="1"></td>
            <td><input type="number" min="0" value="0"></td>
            <td><button class="delete-btn" onclick="deleteRow(this)">✖</button></td>
        `;
        table.appendChild(newRow);
    }

    function deleteRow(btn) {
        btn.closest('tr').remove();
    }
</script>

</body>
</html>
