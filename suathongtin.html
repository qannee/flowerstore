<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin tài khoản</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      border-radius: 15px;
      margin-top: 70px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn-primary {
      border-radius: 25px;
      font-weight: 500;
    }
    .navbar-brand {
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="dadangnhap.html">🌸 Flower Shop</a>
    <button class="navbar-toggler" data-toggle="collapse" data-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="dadangnhap.html">Mua sắm</a></li>
        <li class="nav-item"><a class="nav-link" href="xemdon.html">Đơn hàng</a></li>
      </ul>
    </div>
  </nav>

  <!-- Nội dung -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <h4 class="text-center mb-4 text-primary">Thông tin tài khoản</h4>

          <form id="profileForm">
            <div class="form-group">
              <label>Họ và tên</label>
              <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên" required>
            </div>
            <div class="form-group">
              <label>Địa chỉ</label>
              <input type="text" class="form-control" id="address" placeholder="Nhập địa chỉ mới" required>
            </div>
            <div class="form-group">
              <label>Số điện thoại</label>
              <input type="text" class="form-control" id="phone" placeholder="Nhập số điện thoại">
            </div>

            <button class="btn btn-primary btn-block" type="submit">Cập nhật thông tin</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('profileForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Hiển thị thông báo sau khi nhấn nút
      alert(" Đã chỉnh sửa thông tin thành công!");
      
      // Reset form (tuỳ chọn)
      this.reset();
       window.location.href = "thongtin.html"; 
    });
  </script>

</body>
</html>
