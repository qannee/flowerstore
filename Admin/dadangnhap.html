<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trang quản lý - Cửa hàng hoa</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #a8e063, #56ab2f);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 350px;
    }
    h1 {
      color: #2d6a1f;
      margin-bottom: 25px;
    }
    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #56ab2f;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #3b8d25;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌸 Trang quản lý</h1>
    <button onclick="location.href='quanlidonhang.html'">📦 Quản lý đơn hàng</button>
    <button onclick="location.href='quanlisanpham.html'">🌷 Quản lý sản phẩm</button>
    <button onclick="location.href='quanlikhachhang.html'">👩‍💼 Quản lý khách hàng</button>
  </div>
</body>
</html>
