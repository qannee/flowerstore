<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
    body {
      background: #f8f9fa;
      font-family: "Poppins", sans-serif;
      background-image: url('images/bg_1.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      
    }
    .register-container {
      max-width: 450px;
      margin: 80px auto;
      background: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .register-container h3 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
    }
    .btn-primary {
      width: 100%;
      border-radius: 25px;
    }
    .form-group label {
      font-weight: 500;
    }
    .login-link {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Thanh điều hướng -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">Shop</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="ftco-nav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a href="index.html" class="nav-link">Trang chủ</a></li>
        <li class="nav-item"><a href="shop.html" class="nav-link">Mua sắm</a></li>
        <li class="nav-item"><a href="dangnhap.html" class="nav-link">Đăng nhập</a></li>
      </ul>
    </div>
  </nav>

  <!-- Nội dung đăng ký -->
  <div class="register-container">
    <h3>Đăng ký tài khoản</h3>
    <form>
      <div class="form-group">
        <label for="fullname">Họ và tên</label>
        <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên">
      </div>

      <div class="form-group">
        <label for="email">Địa chỉ Email</label>
        <input type="email" class="form-control" id="email" placeholder="Nhập email">
      </div>

      <div class="form-group">
        <label for="phone">Số điện thoại</label>
        <input type="tel" class="form-control" id="phone" placeholder="Nhập số điện thoại">
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Xác nhận mật khẩu</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu">
      </div>

      <button type="button" class="btn btn-primary">Đăng ký</button>

      <div class="login-link">
        <p>Đã có tài khoản? <a href="dangnhap.html">Đăng nhập ngay</a></p>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    
  document.querySelector(".btn-primary").addEventListener("click", function() {
    // Lưu trạng thái "đã đăng nhập" vào localStorage
    localStorage.setItem("isLoggedIn", "true");
    alert("Đăng ký thành công!");
    window.location.href = "dadangnhap.html"; // quay về trang ddn
  });
</script>
</body>
</html>
