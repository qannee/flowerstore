<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đăng nhập</title>
  <style>
    body
    {
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;background:#f5f7fa;
      padding:20px
    }
    .card
    {
      background:#fff;
      padding:24px;
      border-radius:10px;
      box-shadow:0 4px 20px rgba(0,0,0,0.1);
      width:320px
    }
    h1
    {
      font-size:1.4rem;
      margin-bottom:20px;
      text-align:center
    }
    .form-group{margin-bottom:15px}
    label
    {
      display:block;
      margin-bottom:6px;
      font-size:0.9rem
    }
    input
    {
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:1rem;
      box-sizing: border-box;
    }
    button
    {
      width:100%;
      padding:10px;
      border:none;
      border-radius:6px;
      background:#4f46e5;
      color:#fff;
      font-size:1rem;
      cursor:pointer
    }
    button:hover{background:#4338ca}
  </style>
</head>
<body>
  <div class="card">
    <h1>Đăng nhập</h1>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="phone">Số điện thoại</label>
        <input id="phone" name="phone" type="text" placeholder="Nhập số điện thoại" required />
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" required />
      </div>
      <button type="submit">Đăng nhập</button>
    </form>
  </div>

  <script>
    function handleLogin(e){
      e.preventDefault();
      alert('Đăng nhập thành công!');
      window.location.href = "index2.html"; // 👉 thay YOUR_LINK_HERE.html bằng link trang chủ của bạn
    }
  </script>
</body>
</html>
